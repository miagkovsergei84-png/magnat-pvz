<style>
/* Layout: one phone-sized column — HUD strip, warehouse canvas, hint line, "in hands" tray; DOM overlays for menus. Single dark warehouse look. */
:root{
  --bg:#15181c; --panel:#1f242a; --panel2:#2a3038; --ink:#eef1ec; --muted:#8f9aa5;
  --accent:#ff7a1a; --good:#4cd18a; --bad:#ff5d5d; --gold:#ffd166; --ai:#5bd6ff;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;gap:6px;box-sizing:border-box}
#hud{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.chip{background:var(--panel);border-radius:8px;padding:4px 7px;font-weight:800;font-size:12px;white-space:nowrap}
.chip.time{font-family:var(--display);font-weight:400;letter-spacing:.04em}
.chip.cash{color:var(--good)} .chip.cash.neg{color:var(--bad)}
.chip.stars{color:var(--gold)}
#hCombo{background:#3a2a1c;color:var(--accent)} #hCombo.hot{background:var(--accent);color:#1a0f05}
#evt{background:var(--accent);color:#1a0f05}
.spacer{flex:1}
.ibtn{background:var(--panel2);color:var(--ink);border:0;border-radius:8px;padding:4px 9px;font:800 13px var(--body);cursor:pointer}
.ibtn:focus-visible,.btn:focus-visible,.slot:focus-visible,.item button:focus-visible,.pick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:12px;touch-action:none;background:#2b3036}
#hint{font-size:12px;font-weight:800;color:#ffd8b8;text-align:center;min-height:16px;line-height:16px}
#tray{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:10px;padding:6px 10px;min-height:50px;box-sizing:border-box}
#tray .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
#slots{display:flex;gap:8px;flex:1;min-width:0;align-items:center}
.slot{width:44px;height:44px;border-radius:8px;border:2px dashed #3a424c;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.slot.on{border:2px solid var(--accent);background:#2f2a24}
.slot.full{border-style:solid;border-color:#3a424c}
.emptytxt{font-size:12px;color:var(--muted)}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,12,14,.72);border-radius:12px;padding:12px;box-sizing:border-box}
.card{background:var(--panel);border-radius:14px;padding:18px;width:100%;max-width:340px;max-height:100%;overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
.card h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.card h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;text-wrap:balance}
.card p{margin:0;line-height:1.45;color:#cfd5d0}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:800}
.btn{background:var(--accent);color:#1a0f05;border:0;border-radius:10px;padding:12px 14px;font:800 16px var(--body);cursor:pointer;width:100%}
.btn.sec{background:var(--panel2);color:var(--ink)}
a.btn{display:block;box-sizing:border-box;text-align:center;text-decoration:none}
.soundActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.soundActions>.btn{min-height:44px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px}
.testrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.testrow button{background:var(--panel2);color:var(--ink);border:0;border-radius:8px;padding:6px 10px;font:800 13px var(--body);cursor:pointer}
.rows{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}
.rows .v{text-align:right;font-weight:800}
.rows .tot{border-top:1px solid #3a424c;padding-top:6px;font-weight:800}
.pos{color:var(--good)} .neg{color:var(--bad)}
.goals{display:flex;flex-direction:column;gap:6px;background:var(--panel2);border-radius:10px;padding:10px}
.goal{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:7px;font-weight:700;font-size:14px}
.goal .st{color:#4a525c;font-size:18px;line-height:1} .goal.ok .st{color:var(--gold)}
.bigstars{font-size:34px;letter-spacing:6px;color:#4a525c;text-align:center} .bigstars b{color:var(--gold);font-weight:400}
.cat{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800;margin-top:4px}
.item{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;background:var(--panel2);border-radius:10px;padding:10px}
.item b{font-size:14px} .item small{color:var(--muted);font-size:12px}
.item>b{flex:1 1 120px;min-width:0;overflow-wrap:anywhere}
.item>small{flex:0 0 100%;min-width:0;line-height:1.35;overflow-wrap:anywhere}
.item button{flex:0 1 auto;box-sizing:border-box;margin-left:auto;max-width:min(132px,100%);min-height:44px;background:var(--accent);color:#1a0f05;border:0;border-radius:8px;padding:8px 10px;font:800 13px/1.2 var(--body);cursor:pointer;min-width:74px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.item button:disabled{background:#3a424c;color:var(--muted);cursor:default}
.guidePanel{display:flex;flex-direction:column;gap:6px;border:2px solid #5bd6ff;border-radius:10px;padding:10px;background:#1b3541;color:var(--ink)}
.guideNarratorHeader{display:flex;align-items:center;gap:8px}
.guideNarratorPortrait{width:48px;height:48px;object-fit:cover;object-position:center 16%;border-radius:50%;border:2px solid #5bd6ff;background:#15304a;flex:none}
.guidePanel p{font-size:13px;line-height:1.4;color:var(--ink)}
.guideAck{align-self:flex-start;min-height:40px;padding:6px 14px;border:0;border-radius:8px;background:#5bd6ff;color:#10232c;font:800 13px var(--body);cursor:pointer}
.guideAck:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.guidePulse{outline:2px solid #5bd6ff;outline-offset:1px;animation:guidePulse 1.6s ease-in-out infinite}
@keyframes guidePulse{0%,100%{outline-color:#5bd6ff}50%{outline-color:#ffd166}}
.storyQueue,.storyHelper{height:148px;overflow:hidden;position:relative;border-radius:12px;background:linear-gradient(145deg,#284557,#192633);border:1px solid #547688}
.storyQueuePeople{position:absolute;inset:5px 0 0;display:flex;justify-content:center;align-items:flex-end;animation:storyDeparture 2s ease-out forwards}
.storyQueuePerson{position:relative;flex:0 0 20%;max-width:90px;height:135px}
.storyQueuePerson img{width:100%;height:100%;object-fit:contain}
.storyQueuePerson i{position:absolute;right:0;top:0;font-style:normal;font-size:20px;background:#fff;border-radius:50%;padding:3px}
@keyframes storyDeparture{from{transform:translateX(0);opacity:1}to{transform:translateX(110%);opacity:0}}
.storyHelper{display:flex;justify-content:center;align-items:flex-start}.storyHelper img{width:115px;height:170px;object-fit:cover;object-position:top}
.storySpeaker{margin:10px 0 3px!important;font-weight:800;color:#5bd6ff!important}.storyText{color:var(--ink)!important;line-height:1.45}
.storyFade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9999}
.pick{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--panel2);color:var(--ink);border:2px solid transparent;border-radius:10px;padding:10px;font:700 13px var(--body);cursor:pointer}
.pick b{font-size:14px} .pick small{color:var(--muted);font-size:12px} .pick.on{border-color:var(--accent);background:#2f2a24}
.stripe{height:10px;border-radius:5px;background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,#1a0f05 10px 20px)}
.scard{display:flex;flex-direction:column;gap:6px;background:var(--panel2);border-radius:10px;padding:10px}
.scard small{color:var(--muted);font-size:12px;line-height:1.35}
.stats{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:800;color:#cfd5d0;font-variant-numeric:tabular-nums}
.stats i{font-style:normal;color:var(--gold);letter-spacing:1px}
.roles{display:flex;gap:6px}
.rbtn{flex:1;background:#20252b;color:var(--ink);border:2px solid transparent;border-radius:8px;padding:6px 4px;font:800 12px var(--body);cursor:pointer}
.rbtn.on{border-color:var(--accent);background:#2f2a24}
.hire,.fire{align-self:flex-start;border:0;border-radius:8px;padding:7px 12px;font:800 13px var(--body);cursor:pointer}
.hire{background:var(--accent);color:#1a0f05} .hire:disabled{background:#3a424c;color:var(--muted);cursor:default}
.fire{background:transparent;color:var(--bad);padding:4px 0}
.lvup{color:var(--gold);font-weight:800;font-size:13px}
[hidden]{display:none!important}
.soundVolume{font-weight:800}.soundVolume output{float:right}#sfxVolume,#musicVolume{display:block;box-sizing:border-box;width:100%;max-width:100%;margin-inline:0;min-height:44px;accent-color:var(--accent)}
#bSound{flex-shrink:0;min-height:44px;min-width:44px}#tray .emptytxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
